seed: 42

# Preprocessing constants are fixed in code (src/preprocessing/normalize.py and
# pipeline.py), not runtime-wired. GCN/LCN epsilons live in normalize.py
# (GCN_EPSILON / LCN_EPSILON). The values below are reference-only and must be
# kept in sync with those modules.
preprocessing:
  lcn_window_size: 9      # normalize.LCN_WINDOW_DEFAULT
  output_size: 224        # pipeline.TARGET_SIZE

training:
  batch_size: 32
  num_workers: 8
  learning_rate: 1.0e-4
  epochs: 50
  weight_decay: 1.0e-4
  early_stopping_patience: 10  # stop if val F1 does not improve for this many epochs
  # optimizer: AdamW (fixed for Phase 4; make configurable in Phase 5 if needed)

wandb:
  project: sfx-hitfinder
  entity: null  # set per user

hitfinder:
  # Backend options: "pf8" (default, C bridge), "pf8_numpy", "pf8_python" (ssc Cython), "gpu", "mock"
  backend: pf8
  pf8_threshold: 800.0
  pf8_min_snr: 5.0
  pf8_min_pix_count: 2
  pf8_max_pix_count: 200
  pf8_local_bg_radius: 3
  pf8_min_res: 0
  pf8_max_res: 0
  pf8_use_saturated: false
  gpu_script_path: ""
  gpu_device: cuda

benchmark:
  split_seed: 42
  split_ratios: [0.80, 0.10, 0.10]
  variants: [strict_lodo, semi_supervised_lodo]
  detector_agnostic_max_relative_degradation: null  # set after Phase 4
  detector_agnostic_min_absolute_ap: null           # set after Phase 4
