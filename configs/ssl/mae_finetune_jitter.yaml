# Fine-tune MAE-pretrained ViT-S/16 through the unchanged asymmetric pipeline.
model:
  backbone: mae_vit_small_patch16
  pretrained: false        # no ImageNet weights — encoder comes from ssl.pretrain_checkpoint
  num_classes: 2

ssl:
  embed_dim: 384
  depth: 12
  num_heads: 6
  # pretrain_checkpoint is fold-dependent — supplied via --pretrain-checkpoint CLI arg
  pretrain_checkpoint: null

training:
  log_val_breakdown: true   # diagnostics only (extra val/* metrics); training is unaffected
  save_epochs: [1, 3, 10]   # epoch<N>.pt snapshots for the per-epoch crop sweep
  epochs: 100
  learning_rate: 5.0e-5    # lower than ResNet's 1e-4 — full ViT fine-tune convention
  early_stopping_patience: 10
  num_workers: 32

lodo:
  detector_dirs:
    AGIPD:       /data/bioxfel/user/gihan/Resonet/production/agipd_20k
    JUNGFRAU_4M: /data/bioxfel/user/gihan/Resonet/production/jungfrau_20k
    ePix10k:     /data/bioxfel/user/gihan/Resonet/production/epix10k_20k
    Eiger4M:     /data/bioxfel/user/gihan/Resonet/production/eiger4m_20k
  cxi_pattern: "compressed*.cxi"
  label_key: entry_1/labels/hit

hitfinder:
  backend: pf8
  pf8_threshold: 800.0
  pf8_min_snr: 5.0
  pf8_min_pix_count: 2
  pf8_max_pix_count: 200
  pf8_local_bg_radius: 3
  pf8_min_res: 0
  pf8_max_res: 0
  pf8_use_saturated: false
  gpu_script_path: ""
  gpu_device: cuda

benchmark:
  aggregation: vote
  min_hit_patches: 3
  patch_stride: 224

wandb:
  tags: [ssl-finetune]

# SSL fine-tuning relies on the frame cache for throughput; override the
# (now-false) base.yaml default explicitly rather than depending on it.
cache:
  enabled: true

# Positive-jitter variant: identical to the file this was copied from except for this block.
# Run with --run-suffix jitter (the CLI guard requires a suffix when these keys are set).
asymmetric:
  positive_jitter: uniform     # peak uniformly placed in the positive crop (>= jitter_edge_pad from the border)
  jitter_edge_pad: 32
  crop_within_frame: true      # no crop overlaps the 112 px zero pad band (evaluation tiles never do)
